<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>CyberShield</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#0a0d14;
      --surface:#111827;
      --surface2:#1a2235;
      --border:#1e2d45;
      --text:#e2e8f0;
      --muted:#64748b;
      --safe:#22c55e;
      --safe-bg:rgba(34,197,94,.08);
      --safe-border:rgba(34,197,94,.2);
      --danger:#ef4444;
      --danger-bg:rgba(239,68,68,.08);
      --danger-border:rgba(239,68,68,.22);
      --warn:#f59e0b;
      --warn-bg:rgba(245,158,11,.08);
      --warn-border:rgba(245,158,11,.2);
      --blue:#3b82f6;
      --blue-bg:rgba(59,130,246,.1);
      --radius:12px;
    }

    body{
      width:360px;
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',system-ui,sans-serif;
      font-size:13px;
      overflow-x:hidden;
    }

    
    .hdr{
      display:flex;align-items:center;gap:10px;
      padding:13px 14px 11px;
      background:linear-gradient(135deg,#0d1526,#111f38);
      border-bottom:1px solid var(--border);
    }
    .hdr-logo{width:30px;height:30px;flex-shrink:0}
    .hdr-info{flex:1;min-width:0}
    .hdr-title{font-size:14px;font-weight:800;color:#f1f5f9;letter-spacing:.2px}
    .hdr-sub{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
    .hdr-rescan{
      display:flex;align-items:center;gap:5px;
      background:var(--blue-bg);border:1px solid rgba(59,130,246,.25);
      color:#60a5fa;border-radius:8px;padding:5px 9px;
      font-size:10px;font-weight:600;cursor:pointer;
      transition:all .2s;white-space:nowrap;letter-spacing:.3px
    }
    .hdr-rescan:hover{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.45)}
    .hdr-rescan svg{width:11px;height:11px}

    /* ── SCAN LOADER ── */
    .loader{display:none;padding:28px 16px;text-align:center}
    .loader.on{display:block}
    .loader-ring{
      width:44px;height:44px;margin:0 auto 12px;
      border-radius:50%;
      border:3px solid rgba(59,130,246,.12);
      border-top-color:#3b82f6;
      animation:spin .75s linear infinite
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-txt{font-size:11px;color:var(--muted);animation:blink 1.4s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}

  
    .body{padding:12px 14px 14px}

   
    .scard{
      border-radius:var(--radius);padding:14px;
      border:1px solid var(--border);
      background:var(--surface);
      margin-bottom:10px;
      position:relative;overflow:hidden;
      transition:border-color .3s,background .3s
    }
    .scard::after{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      border-radius:var(--radius) var(--radius) 0 0;
      background:transparent;transition:background .3s
    }
    .scard.s-safe{border-color:var(--safe-border);background:var(--safe-bg)}
    .scard.s-safe::after{background:linear-gradient(90deg,#16a34a,#22c55e)}
    .scard.s-phishing{border-color:var(--danger-border);background:var(--danger-bg)}
    .scard.s-phishing::after{background:linear-gradient(90deg,#dc2626,#ef4444)}
    .scard.s-unknown{border-color:var(--warn-border);background:var(--warn-bg)}
    .scard.s-unknown::after{background:linear-gradient(90deg,#d97706,#f59e0b)}

    
    .scard-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .scard-icon{
      width:38px;height:38px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0
    }
    .scard-icon.i-safe{background:rgba(34,197,94,.12)}
    .scard-icon.i-phishing{background:rgba(239,68,68,.12)}
    .scard-icon.i-unknown{background:rgba(245,158,11,.12)}
    .scard-icon svg{width:22px;height:22px}

    .scard-label{
      font-size:20px;font-weight:800;letter-spacing:.4px;line-height:1
    }
    .scard-label.c-safe{color:var(--safe)}
    .scard-label.c-phishing{color:var(--danger)}
    .scard-label.c-unknown{color:var(--warn)}

    .risk-pill{
      margin-left:auto;font-size:9px;font-weight:700;
      letter-spacing:.8px;text-transform:uppercase;
      padding:3px 8px;border-radius:20px
    }
    .rp-safe{background:rgba(34,197,94,.12);color:var(--safe);border:1px solid rgba(34,197,94,.25)}
    .rp-high{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25)}
    .rp-med{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.25)}
    .rp-none{background:rgba(100,116,139,.1);color:var(--muted);border:1px solid rgba(100,116,139,.2)}

    /* confidence bar */
    .conf-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}
    .conf-val{font-weight:700;color:var(--text)}
    .bar-track{height:5px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-bottom:11px}
    .bar-fill{height:100%;border-radius:99px;width:0;transition:width .9s ease-out}
    .bf-safe{background:linear-gradient(90deg,#16a34a,#22c55e)}
    .bf-phishing{background:linear-gradient(90deg,#dc2626,#ef4444);box-shadow:0 0 6px rgba(239,68,68,.35)}
    .bf-unknown{background:linear-gradient(90deg,#d97706,#f59e0b)}

    /* reasons */
    .reasons-hd{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .reason-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px;font-size:11px;color:#cbd5e1;line-height:1.4}
    .rdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px}
    .rd-safe{background:var(--safe)}
    .rd-phishing{background:var(--danger)}
    .rd-unknown{background:var(--warn)}

    /* ── META ── */
    .meta{
      background:var(--surface);border:1px solid var(--border);
      border-radius:10px;padding:9px 11px;margin-bottom:10px
    }
    .meta-lbl{font-size:9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#334155;margin-bottom:3px}
    .meta-url{font-size:10px;color:#94a3b8;word-break:break-all;line-height:1.4;font-family:'Courier New',monospace}
    .meta-time{font-size:9px;color:#334155;margin-top:3px}

    /* ── STATS ── */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
    .stat{
      background:var(--surface);border:1px solid var(--border);
      border-radius:9px;padding:8px 6px;text-align:center
    }
    .stat-n{font-size:17px;font-weight:800;color:#f1f5f9}
    .stat-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:1px}

    /* ── BUTTONS ── */
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
    .btn{
      display:flex;align-items:center;justify-content:center;gap:5px;
      padding:8px 10px;border-radius:9px;font-size:10px;font-weight:600;
      cursor:pointer;border:1px solid transparent;transition:all .18s;letter-spacing:.2px
    }
    .btn svg{width:12px;height:12px;flex-shrink:0}
    .btn:active{transform:scale(.97)}
    .btn-report{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2);color:var(--warn)}
    .btn-report:hover{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4)}
    .btn-export{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.2);color:#818cf8}
    .btn-export:hover{background:rgba(99,102,241,.15);border-color:rgba(99,102,241,.4)}

    /* ── HISTORY ── */
    .hist{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
    .hist-hdr{
      display:flex;align-items:center;justify-content:space-between;
      padding:9px 12px;cursor:pointer;user-select:none;
      background:rgba(255,255,255,.015);transition:background .15s
    }
    .hist-hdr:hover{background:rgba(255,255,255,.03)}
    .hist-hdr-l{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#94a3b8}
    .hist-hdr-l svg{width:13px;height:13px}
    .hist-hdr-r{display:flex;align-items:center;gap:7px}
    .hist-clr{background:none;border:none;color:#334155;font-size:9px;cursor:pointer;padding:2px 5px;border-radius:4px;transition:color .15s}
    .hist-clr:hover{color:var(--danger)}
    .hist-chev{color:#334155;transition:transform .2s}
    .hist-chev.open{transform:rotate(180deg)}

    .hist-body{display:none;max-height:240px;overflow-y:auto}
    .hist-body.open{display:block}
    .hist-body::-webkit-scrollbar{width:3px}
    .hist-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

    .hist-empty{padding:18px;text-align:center;color:#334155;font-size:11px}

    /* history item */
    .hi{border-top:1px solid rgba(255,255,255,.04)}
    .hi-hdr{
      display:flex;align-items:center;gap:7px;
      padding:8px 12px;cursor:pointer;transition:background .12s
    }
    .hi-hdr:hover{background:rgba(255,255,255,.025)}
    .hi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .hd-safe{background:var(--safe);box-shadow:0 0 4px rgba(34,197,94,.5)}
    .hd-phishing{background:var(--danger);box-shadow:0 0 4px rgba(239,68,68,.5)}
    .hd-unknown{background:var(--warn);box-shadow:0 0 4px rgba(245,158,11,.5)}
    .hi-url{flex:1;font-size:10px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Courier New',monospace}
    .hi-conf{font-size:10px;font-weight:700;flex-shrink:0}
    .hi-arr{font-size:9px;color:#334155;flex-shrink:0;transition:transform .15s}
    .hi-arr.open{transform:rotate(180deg)}

    .hi-body{display:none;padding:0 12px 9px 26px;background:rgba(0,0,0,.12)}
    .hi-body.open{display:block}
    .hi-d{font-size:9px;color:#475569;line-height:1.7;word-break:break-all}
    .hi-d b{color:#64748b}
    .hi-reasons{margin-top:4px}
    .hi-reasons span{display:block;font-size:9px;color:#475569;line-height:1.6}
    .hi-reasons span::before{content:'▸ ';color:#334155}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:10px;left:50%;
      transform:translateX(-50%) translateY(14px);
      background:#1e293b;border:1px solid rgba(255,255,255,.08);
      color:var(--text);font-size:11px;padding:7px 14px;
      border-radius:8px;opacity:0;transition:all .25s;
      pointer-events:none;white-space:nowrap;z-index:999;
      box-shadow:0 4px 20px rgba(0,0,0,.5)
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.ok{border-color:rgba(34,197,94,.35);color:var(--safe)}
    .toast.err{border-color:rgba(239,68,68,.35);color:var(--danger)}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <svg class="hdr-logo" viewBox="0 0 32 32" fill="none">
    <defs>
      <linearGradient id="sg" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1d4ed8"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>
    <path d="M16 2L4 8.5V16C4 22.6 9.4 28.5 16 30C22.6 28.5 28 22.6 28 16V8.5L16 2Z"
          fill="url(#sg)" stroke="#3b82f6" stroke-width="1.2"/>
    <path d="M11 16L14.5 19.5L21 13" stroke="#fff" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="hdr-info">
    <div class="hdr-title">CyberShield</div>
    <div class="hdr-sub">AI Phishing Detector</div>
  </div>
  <button class="hdr-rescan" id="rescan-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    Rescan
  </button>
</div>

<!-- SCAN LOADER -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-txt">Scanning website…</div>
</div>

<!-- BODY -->
<div class="body" id="body">

  <!-- STATUS CARD -->
  <div class="scard s-unknown" id="scard">
    <div class="scard-top">
      <div class="scard-icon i-unknown" id="scard-icon">
        <!-- injected by JS -->
      </div>
      <div class="scard-label c-unknown" id="scard-label">SCANNING…</div>
      <div class="risk-pill rp-none" id="risk-pill">—</div>
    </div>

    <div class="conf-row">
      <span>Confidence</span>
      <span class="conf-val" id="conf-val">—</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill bf-unknown" id="bar-fill"></div>
    </div>

    <div id="reasons-wrap" style="display:none">
      <div class="reasons-hd">Top Indicators</div>
      <div id="reasons-list"></div>
    </div>
  </div>

  <!-- META -->
  <div class="meta">
    <div class="meta-lbl">Current URL</div>
    <div class="meta-url" id="meta-url">Loading…</div>
    <div class="meta-time" id="meta-time"></div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-n" id="st-total">0</div>
      <div class="stat-l">Total Scans</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="st-threats" style="color:var(--danger)">0</div>
      <div class="stat-l">Threats</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="st-safe" style="color:var(--safe)">0</div>
      <div class="stat-l">Safe</div>
    </div>
  </div>

  <!-- BUTTONS -->
  <div class="btns">
    <button class="btn btn-report" id="report-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      Report Site
    </button>
    <button class="btn btn-export" id="export-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export CSV
    </button>
  </div>

  <!-- HISTORY -->
  <div class="hist">
    <div class="hist-hdr" id="hist-toggle">
      <div class="hist-hdr-l">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Last 10 Scans
      </div>
      <div class="hist-hdr-r">
        <button class="hist-clr" id="hist-clr">Clear</button>
        <svg class="hist-chev" id="hist-chev" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" width="13" height="13">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
    </div>
    <div class="hist-body" id="hist-body">
      <div class="hist-empty" id="hist-empty">No scans yet.</div>
      <div id="hist-list"></div>
    </div>
  </div>

</div><!-- /body -->

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
